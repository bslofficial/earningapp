<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Earning App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="custom-alert" class="alert-overlay hidden">
        <div class="alert-box">
            <h3>Admin Panel</h3>
            <p id="alert-msg"></p>
            <button onclick="window.closeAlert()">ঠিক আছে</button>
        </div>
    </div>

    <div id="app">
        <!-- Admin Login Page -->
        <div id="admin-auth-page" class="container">
            <header><div class="logo">Admin <span>Panel</span></div></header>
            <div class="auth-box">
                <h2>অ্যাডমিন লগইন</h2>
                <input type="email" id="admin-email" placeholder="অ্যাডমিন ইমেইল">
                <input type="password" id="admin-pass" placeholder="পাসওয়ার্ড">
                <button id="admin-login-btn" class="btn-sm">লগইন করুন</button>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-dashboard" class="hidden" style="padding: 15px; max-width: 600px; margin: auto;">
            <header style="display: flex; justify-content: space-between; align-items: center; background: #1a237e; color: white; padding: 15px; border-radius: 8px;">
                <div class="logo" style="font-size: 20px;">অ্যাডমিন ড্যাশবোর্ড</div>
                <button onclick="window.adminLogout()" style="background: #ff5252; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;">লগআউট</button>
            </header>

            <div style="margin-top: 20px;">
                <h3 style="margin-bottom: 10px; color: #333;">উইথড্র রিকোয়েস্টসমূহ</h3>
                <div id="withdraw-requests-list" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); min-height: 100px;">
                    <p style="text-align: center; color: #666;">লোড হচ্ছে...</p>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <h3 style="margin-bottom: 10px; color: #333;">সকল ইউজার লিস্ট</h3>
                <div id="all-users-list" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); min-height: 100px;">
                    <p style="text-align: center; color: #666;">লোড হচ্ছে...</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="admin.js"></script>
</body>
</html>
